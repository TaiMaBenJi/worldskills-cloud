  <text x="105" y="425" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#182338">视觉与末端</text>
  <text x="105" y="460" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#5b6b85">手眼标定夹爪调试</text>
  <rect x="465" y="330" width="350" height="150" rx="12" fill="#edf2fd" stroke="#dfe6f0" stroke-width="1.5"/>
  <text x="490" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="bold" fill="#2b5cd9">05</text>
  <text x="490" y="425" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#182338">安全与周边</text>
  <text x="490" y="460" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#5b6b85">风险评估光栅门锁</text>
  <rect x="850" y="330" width="350" height="150" rx="12" fill="#edf2fd" stroke="#dfe6f0" stroke-width="1.5"/>
  <text x="875" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="bold" fill="#2b5cd9">06</text>
  <text x="875" y="425" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#182338">调试与交付</text>
  <text x="875" y="460" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#5b6b85">先单机后联锁节拍</text>
  <text x="640" y="525" text-anchor="middle" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#8a97ad">依据总纲第三部分绘制 · 赛项标准以世界技能组织官方文件为准</text>
