  <text x="490" y="245" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#182338">传感器技术</text>
  <text x="490" y="280" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#5b6b85">选型安装信号调试</text>
  <rect x="850" y="150" width="350" height="150" rx="12" fill="#edf2fd" stroke="#dfe6f0" stroke-width="1.5"/>
