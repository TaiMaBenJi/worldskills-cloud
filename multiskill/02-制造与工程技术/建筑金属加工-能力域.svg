  <text x="105" y="425" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#182338">组对与连接</text>
  <text x="105" y="460" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#5b6b85">找方组对与焊接顺序</text>
  <rect x="465" y="330" width="350" height="150" rx="12" fill="#edf2fd" stroke="#dfe6f0" stroke-width="1.5"/>
  <text x="490" y="380" font-family="Noto Sans CJK SC, sans-serif" font-size="30" font-weight="bold" fill="#2b5cd9">05</text>
  <text x="490" y="425" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#182338">安装与调校</text>
