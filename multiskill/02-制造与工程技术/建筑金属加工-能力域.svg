  <text x="105" y="280" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#5b6b85">结构图与实尺放样</text>
  <rect x="465" y="150" width="350" height="150" rx="12" fill="#edf2fd" stroke="#dfe6f0" stroke-width="1.5"/>
