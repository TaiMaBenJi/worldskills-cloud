<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>混凝土建筑 · 模拟训练</title>
<style>
:root{--bg:#f4f6fa;--text:#182338;--dim:#5b6b85;--dim2:#8a97ad;--line:#dfe6f0;--line2:#e9eef6;--blue:#2b5cd9;--blue-deep:#2450c0;--blue-tint:#edf2fd;--green:#0f9d6c;--red:#cf3830;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans SC",sans-serif;font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:14px 14px 60px}
.head{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
.head h1{margin:0 0 4px;font-size:19px;font-weight:800}
.head p{margin:0;color:var(--dim);font-size:13px}
.meta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{font-size:12px;color:var(--blue);background:var(--blue-tint);border:1px solid rgba(43,92,217,.3);border-radius:6px;padding:2px 10px}
.track{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;margin-top:12px}
.track i{display:block;height:100%;width:0;background:var(--blue);transition:width .3s}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(24,35,56,.04)}
.qnum{font-size:12px;color:var(--dim2);letter-spacing:1px}
.qtext{font-size:15.5px;font-weight:700;margin:4px 0 12px;line-height:1.7}
.opt{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin:8px 0;color:var(--text);font-size:14px;cursor:pointer}
.opt:hover{border-color:rgba(43,92,217,.5)}
.opt.right{background:#eaf7f1;border-color:var(--green);font-weight:700}
.opt.wrong{background:#fdeeed;border-color:var(--red)}
.opt:disabled{cursor:default}
.seqpool{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.seqchip{background:var(--blue-tint);border:1px solid rgba(43,92,217,.35);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--blue-deep)}
.seqchip.used{opacity:.35;pointer-events:none}
.seqbuild{min-height:48px;border:1px dashed var(--line);border-radius:8px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.seqbuild .seqchip{cursor:pointer;background:#fff}
.explain{display:none;margin-top:10px;background:var(--blue-tint);border-left:4px solid var(--blue);border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;color:#31519e;line-height:1.8}
.btn{display:inline-block;background:var(--blue);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;padding:11px 20px;cursor:pointer;margin-top:12px}
.btn:active{background:var(--blue-deep)}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid rgba(43,92,217,.4)}
.result{display:none;text-align:center;padding:26px 16px}
.result .score{font-size:44px;font-weight:800;color:var(--blue)}
.result .grade{font-size:17px;font-weight:800;margin:6px 0}
.result p{color:var(--dim);font-size:13px;margin:6px 0}
.foot{color:var(--dim2);font-size:11.5px;text-align:center;margin-top:20px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>混凝土建筑 · 模拟训练</h1>
    <p>十个情景训练任务，覆盖识图放样、模板、钢筋、保护层与混凝土浇筑等核心环节，满分一百分，六十分合格。做完每题请对照解析回读总纲对应部分。</p>
    <div class="meta"><span class="chip" id="prog">进度 0 / 10</span><span class="chip" id="scoreChip">得分 0</span><span class="chip">满分 100 分</span></div>
    <div class="track"><i id="bar"></i></div>
  </div>
  <div id="list"></div>
  <div class="card result" id="result">
    <div class="score" id="finalScore">0</div>
    <div class="grade" id="finalGrade"></div>
    <p id="finalNote"></p>
    <button class="btn" onclick="location.reload()">重新训练</button>
  </div>
  <div class="foot">混凝土建筑 · 世界技能大赛全技能精通库<br>训练成绩仅在本机浏览器内计算，不上传任何数据</div>
</div>
<script>
const QS = [{"type":"single","q":"模板支设后、浇筑混凝土前，最必须复核的项目是哪一项。","options":["模板表面是否光亮","轴线位置、垂直度与截面尺寸是否符合图纸，支撑与拉杆是否牢固","模板颜色是否统一","脱模剂涂得越厚越好"],"answer":1,"explain":"浇筑后无法返工，轴线、截面与垂直度必须在浇筑前复核确认，支撑体系失稳会造成胀模甚至坍塌事故。"},{"type":"single","q":"钢筋下料时弯钩与弯折的下料长度计算，主要依据是哪一项。","options":["图纸标注的外形尺寸直接下料","考虑弯曲后钢筋中轴线长度不变的原理，按标注尺寸加弯钩调整值计算","全部按最长边下料","凭经验目测"],"answer":1,"explain":"钢筋弯曲后外皮伸长内皮压缩，中轴线长度不变，因此下料长度要按标注尺寸扣除弯曲调整值并另加弯钩长度。"},{"type":"single","q":"保护层垫块的作用与布点要求，正确的说法是哪一项。","options":["垫块只是垫高模板用，随便放几个","按规范间距布点，保证浇筑振捣后钢筋位置正确、保护层厚度达标","垫块越多越浪费","只在梁底放几个就行"],"answer":1,"explain":"保护层关系到结构耐久与受力，垫块须按间距布足并在浇筑中保持钢筋不移位，是隐蔽验收的必查项。"},{"type":"single","q":"目测判断拌合物坍落度偏大时，正确的处理是哪一项。","options":["直接加水搅拌至合适","报告并按配合比调整，严禁私自加水","继续浇筑不管它","多加水泥掩盖"],"answer":1,"explain":"私自加水会改变水灰比、降低强度，属于严重违规。应通知技术方按配合比与骨料含水情况调整。"},{"type":"single","q":"浇筑柱子混凝土时，正确的振捣要求是哪一项。","options":["振捣棒插入越深越快越好","分层浇筑分层振捣，做到快插慢拔、不漏振不过振，避免碰撞钢筋模板","只在顶部振一次","用锤子敲模板代替振捣"],"answer":1,"explain":"分层浇筑与规范振捣保证密实均匀，过振会离析，漏振有蜂窝孔洞，碰钢筋会移位，碰模板会变形漏浆。"},{"type":"order","q":"一个混凝土构件的完整施工流程，请按正确顺序排列。","steps":["识图放样与模板设计","模板拼装校正并涂脱模剂","钢筋绑扎与垫块布置并做隐蔽验收","浇筑振捣养护到龄期后拆模"],"answer":[0,1,2,3],"explain":"先放样再支模，钢筋完成并通过隐蔽验收后才能浇筑，最后养护到规定龄期拆模。隐蔽验收是强制环节。"},{"type":"order","q":"钢筋绑扎的基本作业顺序，请按正确顺序排列。","steps":["按图核对钢筋规格数量并下料","画线定出钢筋位置","按顺序绑扎并控制间距","安装垫块并自检保护层"],"answer":[0,1,2,3],"explain":"先核对下料，再画线定位，然后按间距纪律绑扎，最后装垫块自检。画线是保证间距纪律的关键步骤。"},{"type":"judge","q":"水灰比越大，混凝土强度越高。","answer":false,"explain":"水灰比过大，硬化后孔隙越多，强度反而越低。配合比设计中的用水量必须严格控制。"},{"type":"judge","q":"混凝土浇筑后需要养护，常见做法是覆盖并洒水保持表面湿润一段时间。","answer":true,"explain":"养护保证水泥水化所需水分与温度，防止开裂与表面起粉，是强度增长的必要条件。"},{"type":"judge","q":"拆模时间越早越好，可以加快模板周转。","answer":false,"explain":"拆模必须以同条件试块或规范规定的强度达到要求为依据，过早拆模会导致结构受损甚至坍塌。"}];
let score = 0, done = 0;
const el = {};
function $(id){return document.getElementById(id)}
function render(){
  const list = $('list');
  QS.forEach(function(q, i){
    const c = document.createElement('div'); c.className = 'card';
    let h = '<div class="qnum">第 ' + (i+1) + ' 题 · ' + typeName(q.type) + '</div><div class="qtext">' + q.q + '</div>';
    if (q.type === 'single' || q.type === 'judge') {
      const opts = q.type === 'judge' ? ['正确', '错误'] : q.options;
      h += opts.map(function(o, j){ return '<button class="opt" data-i="' + i + '" data-j="' + j + '">' + o + '</button>'; }).join('');
    } else if (q.type === 'order') {
      h += '<div class="seqbuild" id="build-' + i + '"></div><div class="seqpool" id="pool-' + i + '">'
        + q.steps.map(function(s, j){ return '<span class="seqchip" data-i="' + i + '" data-j="' + j + '">' + s + '</span>'; }).join('')
        + '</div><button class="btn ghost" data-check="' + i + '" style="margin-top:4px">确认顺序</button>';
    }
    h += '<div class="explain" id="ex-' + i + '">' + q.explain + '</div>';
    c.innerHTML = h; list.appendChild(c);
  });
  list.addEventListener('click', onClick);
}
function typeName(t){ return t === 'single' ? '情景单选' : (t === 'judge' ? '判断' : '工序排序'); }
function answered(i){ return QS[i]._done; }
function onClick(e){
  const t = e.target;
  if (t.classList.contains('opt')) {
    const i = +t.dataset.i, j = +t.dataset.j;
    if (answered(i)) return;
    QS[i]._done = true;
    const btns = t.parentNode.querySelectorAll('.opt');
    btns.forEach(function(b){ b.disabled = true; });
    const right = (QS[i].type === 'judge') ? (j === 0 ? QS[i].answer : !QS[i].answer) : (j === QS[i].answer);
    btns[right ? j : QS[i].answer].classList.add('right');
    if (!right) t.classList.add('wrong'); else score++;
    finish(i, right);
  } else if (t.classList.contains('seqchip')) {
    const i = +t.dataset.i;
    if (answered(i)) return;
    const pool = $('pool-' + i), build = $('build-' + i);
    if (t.parentNode === pool) { build.appendChild(t); } else { pool.appendChild(t); }
  } else if (t.dataset && t.dataset.check !== undefined) {
    const i = +t.dataset.check;
    if (answered(i)) return;
    const build = $('build-' + i);
    const picked = [].map.call(build.querySelectorAll('.seqchip'), function(x){ return +x.dataset.j; });
    if (picked.length !== QS[i].steps.length) return;
    QS[i]._done = true;
    build.querySelectorAll('.seqchip').forEach(function(x){ x.style.pointerEvents = 'none'; });
    const right = picked.join(',') === QS[i].answer.join(',');
    build.style.borderColor = right ? 'var(--green)' : 'var(--red)';
    if (right) score++;
    finish(i, right);
  }
}
function finish(i){
  done++;
  $('ex-' + i).style.display = 'block';
  $('prog').textContent = '进度 ' + done + ' / ' + QS.length;
  $('scoreChip').textContent = '得分 ' + score;
  $('bar').style.width = (done * 100 / QS.length) + '%';
  if (done === QS.length) {
    const pct = score * 100 / QS.length;
    const g = pct >= 90 ? '精通' : (pct >= 75 ? '熟练' : (pct >= 60 ? '合格' : '不合格'));
    $('finalScore').textContent = score * 10 + ' 分';
    $('finalGrade').textContent = '评级：' + g;
    $('finalNote').textContent = pct >= 60 ? '可继续研读总纲薄弱部分，隔日重训巩固。' : '建议回到总纲对照自测清单补齐基础，再来挑战。';
    $('result').style.display = 'block';
    $('result').scrollIntoView({behavior: 'smooth'});
  }
}
render();
</script>
</body>
</html>
