  <text x="490" y="245" font-family="Noto Sans CJK SC, sans-serif" font-size="24" font-weight="bold" fill="#182338">手工与机械</text>
  <text x="490" y="280" font-family="Noto Sans CJK SC, sans-serif" font-size="18" fill="#5b6b85">推刨锯凿 · 安全校准</text>
  <rect x="850" y="150" width="350" height="150" rx="12" fill="#edf2fd" stroke="#dfe6f0" stroke-width="1.5"/>
